name: Visual Check

# Manual regression check: builds the site, checks responsive layouts and
# keyboard/mobile interactions, and uploads screenshots. Does not deploy.
#
# Manual-only by design: it needs to download the Playwright Chromium binary,
# which is blocked on some networks. Run it through Actions on a runner with
# access to the Playwright CDN. Timeouts bound download and preview failures.
on:
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright@1.49.0 wait-on@7
          npx playwright install --with-deps chromium
      - name: Run visual check
        run: |
          npm run preview &
          npx wait-on --timeout 30000 http://localhost:4173/
          node scripts/visual-check.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
