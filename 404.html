<main class="nf">
  <div class="nf__panel glass glass--deep">
    <p class="nf__code">404</p>
    <span class="nf__label">NO ENTITLEMENT FOR THIS RESOURCE</span>

      The path you asked for isn't in the catalogue — no role grants it, and no

    </p>

  </div>
